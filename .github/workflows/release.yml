name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.checksums.outputs.hashes }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Embed frontend in Go binary
        run: |
          rm -rf internal/server/frontend
          mkdir -p internal/server/frontend
          cp -r web/dist/* internal/server/frontend/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: |
          go mod tidy

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            os=$(echo "$target" | cut -d' ' -f1)
            arch=$(echo "$target" | cut -d' ' -f2)

            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"

            echo "Building ${os}/${arch}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/avalokhq/avalok/internal/cli.Version=${{ steps.version.outputs.VERSION }}" \
              -o "avalok${ext}" \
              ./cmd/avalok

            if [[ "$os" == "windows" ]]; then
              zip "avalok-${{ steps.version.outputs.VERSION }}-${os}-${arch}.zip" "avalok${ext}"
            else
              tar czf "avalok-${{ steps.version.outputs.VERSION }}-${os}-${arch}.tar.gz" "avalok${ext}"
            fi
            rm "avalok${ext}"
          done

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          sha256sum avalok-*.tar.gz avalok-*.zip > checksums.txt
          cat checksums.txt
          echo "hashes=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            avalok-*.tar.gz
            avalok-*.zip
            checksums.txt
          retention-days: 1
          if-no-files-found: error

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ github.ref_name }}"

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            avalok-*.tar.gz
            avalok-*.zip
            checksums.txt
